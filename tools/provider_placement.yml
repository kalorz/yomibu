id: provider-placement
language: Rust
severity: error
message: Provider-specific code belongs in integrations, not inner contracts.
files:
  - crates/yomibu-core/src/**/*.rs
  - crates/yomibu-app/src/**/*.rs
rule:
  all:
    - any:
        - all:
            - any:
                - kind: identifier
                - kind: type_identifier
                - kind: field_identifier
            # Snake case / uppercase words, then CamelCase words.
            - regex: |-
                (?x)
                (^|_|r\#)(?i:wani_?kani|open_?ai|anthropic|sudachi|jev)(_|$)
                |(WaniKani|Wanikani|OpenAI|OpenAi|Anthropic|Sudachi|Jev)([A-Z0-9_]|$)
                |JEV([A-Z][a-z]|[0-9_]|$)
        - all:
            - any:
                - kind: string_literal
                - kind: raw_string_literal
            # Match the whole literal, never a fragment between escape sequences.
            - regex: '^[bc]?(r#*)?"(?i:wani_?kani|open_?ai|anthropic|sudachi|jev)"#*$'
    - not:
        inside:
          any:
            - kind: attribute_item
            - kind: inner_attribute_item
          regex: '^#\s*!?\s*\[\s*doc\b'
          stopBy: end
    - not:
        inside:
          stopBy: end
          follows:
            kind: attribute_item
            regex: '^#\s*\[\s*cfg\s*\(\s*test\s*\)\s*\]$'
            stopBy:
              not:
                any:
                  - kind: attribute_item
                  - kind: line_comment
                  - kind: block_comment
