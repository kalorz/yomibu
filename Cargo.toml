[workspace]
members = ["crates/yomibu-core", "crates/yomibu-components", "crates/yomibu", "crates/yomibu-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
yomibu-core = { path = "crates/yomibu-core" }
yomibu-components = { path = "crates/yomibu-components" }
yomibu = { path = "crates/yomibu" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
tempfile = "3"
sha2 = "0.10"
libc = "0.2"
memmap2 = "0.9"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", rev = "90fd6068c80c2fc3b63e0dbab0e341475bad4d8f" }
wiremock = "0.6"
toml = "1"

# cargo test also uses this profile for CLI binaries launched by integration tests.
# Optimize hashing while retaining full pinned-dictionary verification.
[profile.test.package.sha2]
opt-level = 3
