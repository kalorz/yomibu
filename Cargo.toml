[workspace]
members = ["crates/yomibu-core", "crates/yomibu-ext", "crates/yomibu-app", "crates/yomibu-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
sqlx = { version = "0.9", default-features = false }
tokio = "1"
thiserror = { version = "2", default-features = false }
uuid = { version = "1.28", default-features = false }

chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = { version = "1", features = ["raw_value"] }
