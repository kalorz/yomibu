name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BYLAW_VERSION: 0.1.0
  MACHETE_VERSION: 0.9.2
  AST_GREP_VERSION: 0.51.0

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: yomibu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yomibu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the repository toolchain
        # Rustup reads the version and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Verify committed lockfile
        run: git ls-files --error-unmatch Cargo.lock
      - name: Report size and keep guides in their own PR
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          python3 -B tools/check_pr.py "${{ github.event.pull_request.base.sha }}" HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check formatting
        run: cargo fmt --check
      - name: Check provider placement
        run: |
          npm install --prefix "$RUNNER_TEMP/ast-grep" --no-save "@ast-grep/cli@$AST_GREP_VERSION"
          "$RUNNER_TEMP/ast-grep/node_modules/.bin/ast-grep" scan --rule tools/provider_placement.yml .
      - name: Check crate dependencies
        run: python3 -B tools/check_architecture.py
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The tools below live outside ~/.cargo/bin so a stale copy can never shadow them.
          cache-bin: false
      - name: Cache architecture tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-bylaw-${{ env.BYLAW_VERSION }}-machete-${{ env.MACHETE_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install architecture tools
        # cargo install skips a tool already present at the pinned version.
        run: |
          cargo install cargo-bylaw --version "$BYLAW_VERSION" --locked --root "$RUNNER_TEMP/tools"
          cargo install cargo-machete --version "$MACHETE_VERSION" --locked --root "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Check unused dependencies
        run: cargo machete --with-metadata --skip-target-dir
      - name: Check domain and library boundaries
        run: python3 -B tools/check_domain.py
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -D clippy::redundant_clone -D clippy::unused_async
      - name: Test
        run: cargo test --locked --all
      - name: Test against PostgreSQL
        env:
          YOMIBU_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/yomibu_test
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d yomibu_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector;'
          cargo test --locked --all -- --ignored
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Check diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- Cargo.lock
