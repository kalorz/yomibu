name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the repository toolchain
        # Rustup reads the version and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Verify committed lockfile
        run: git ls-files --error-unmatch Cargo.lock
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Prepare the pinned A1 dictionary for real adapter tests
        run: python3 scripts/setup_a1_dictionary.py
      - name: Test
        run: cargo test --locked --all
      - name: Run documented synthetic demonstrations
        shell: bash
        run: |
          cargo run --locked -- preview --word '猫:ねこ:cat' --word '犬:いぬ:dog' --grammar 'です' --take 2
          cargo run --locked --example preview
          cargo run --locked --example prepare
          yomibu_demo_dir=$(mktemp -d)
          trap 'rm -rf "$yomibu_demo_dir"' EXIT
          cargo run --locked --example a1 -- target/a1/system_core.dic tests/fixtures/a1/smoke.json > "$yomibu_demo_dir/a1.json"
          cp tests/fixtures/preparation.json "$yomibu_demo_dir/wanikani.json"
          cp tests/fixtures/grammar.json "$yomibu_demo_dir/grammar.json"
          cargo run --locked -- prepare --data-dir "$yomibu_demo_dir" \
            --grammar-file "$yomibu_demo_dir/grammar.json" --target '一つ:ひとつ:one thing'
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Check diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- Cargo.lock
