name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the repository toolchain
        # Rustup reads the version and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Verify committed lockfile
        run: git ls-files --error-unmatch Cargo.lock
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Prepare the pinned Sudachi dictionary for real adapter tests
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/setup_test_dictionary.py
          cargo run --locked --profile test -- dictionary import \
            --bundle target/test-resources/sudachi-core/current \
            --data-dir target/test-resources/setup \
            --dictionary-dir target/test-resources/managed-dictionary
      - name: Test
        run: cargo test --locked --all
      - name: Run documented offline story demonstrations
        shell: bash
        run: |
          yomibu_demo_dir=$(mktemp -d)
          trap 'rm -rf "$yomibu_demo_dir"' EXIT
          cargo run --locked -- prepare-retrieval \
            --inventory tests/fixtures/story/inventory.json \
            --request tests/fixtures/story/request.json \
            --embedding-cache "$yomibu_demo_dir/vectors.json" --embedding-provider lexical-baseline
          cargo run --locked -- preview-story \
            --inventory tests/fixtures/story/inventory.json \
            --request tests/fixtures/story/request.json \
            --embedding-cache "$yomibu_demo_dir/vectors.json" --json
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Check diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- Cargo.lock
