name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BYLAW_VERSION: 0.1.0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the repository toolchain
        # Rustup reads the version and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Verify committed lockfile
        run: git ls-files --error-unmatch Cargo.lock
      - name: Check crate dependencies
        run: python3 -B tools/check_architecture.py
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check unused dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-machete --version 0.9.2 --locked
          cargo machete --with-metadata --skip-target-dir
      - name: Cache the architecture analyzer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bylaw
          # Unrelated manifests and preinstalled toolchains must not invalidate this tool.
          key: bylaw-${{ runner.os }}-${{ runner.arch }}-${{ env.BYLAW_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install the architecture analyzer
        run: |
          cargo install cargo-bylaw --version "$BYLAW_VERSION" --locked --root "$RUNNER_TEMP/bylaw"
          echo "$RUNNER_TEMP/bylaw/bin" >> "$GITHUB_PATH"
      - name: Check dependency boundaries and enforcement contracts
        run: |
          python3 -B -m unittest discover -s tools -p 'test_*.py' -v
          python3 -B tools/check_domain.py
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -D clippy::redundant_clone -D clippy::unused_async
      - name: Test
        run: cargo test --locked --all
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Check diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- Cargo.lock
