# Partial guards, not effect analysis. Review new libraries/APIs for ambient effects.
# Enable these restrictions in domain only (see domain/mod.rs and Cargo.toml).
disallowed-methods = [
    "std::time::Instant::now",
    "std::time::Instant::elapsed",
    "std::time::SystemTime::now",
    "std::env::var",
    "std::fs::read_to_string",
    # SQLx can enable Chrono clock features through workspace feature unification.
    { path = "chrono::Utc::now", allow-invalid = true },
    { path = "chrono::Utc::today", allow-invalid = true },
    { path = "chrono::Local::now", allow-invalid = true },
    { path = "chrono::Local::today", allow-invalid = true },
    # These APIs only exist when dependencies enable UUID generation features.
    { path = "uuid::Uuid::now_v1", allow-invalid = true },
    { path = "uuid::Uuid::new_v4", allow-invalid = true },
    { path = "uuid::Uuid::now_v6", allow-invalid = true },
    { path = "uuid::Uuid::new_v7", allow-invalid = true },
    { path = "uuid::Uuid::now_v7", allow-invalid = true },
    { path = "uuid::ContextV1::new_random", allow-invalid = true },
    { path = "uuid::Timestamp::now", allow-invalid = true },
]
disallowed-types = [
    # Local timezone conversion consults ambient system configuration.
    { path = "chrono::Local", allow-invalid = true },
    "std::fs::File",
    "std::net::TcpStream",
    { path = "uuid::ContextV7", allow-invalid = true },
]
disallowed-macros = ["std::env", "std::option_env", "std::include_str"]
