# Selected external-access guards. Application timing/scheduling remains permitted.
disallowed-methods = [
    "std::env::var", "std::env::var_os", "std::env::vars", "std::env::vars_os",
    "std::env::set_var", "std::env::remove_var", "std::env::args", "std::env::args_os",
    "std::env::current_dir", "std::env::set_current_dir", "std::env::current_exe",
    "std::env::home_dir", "std::env::temp_dir",
    "std::fs::read", "std::fs::read_to_string", "std::fs::write",
    "std::fs::metadata", "std::fs::symlink_metadata", "std::fs::exists",
    "std::fs::read_dir", "std::fs::read_link", "std::fs::canonicalize",
    "std::fs::copy", "std::fs::rename", "std::fs::hard_link", "std::fs::set_permissions",
    "std::fs::create_dir", "std::fs::create_dir_all",
    "std::fs::remove_file", "std::fs::remove_dir", "std::fs::remove_dir_all",
    "std::path::absolute", "std::path::Path::canonicalize",
    "std::path::Path::metadata", "std::path::Path::symlink_metadata",
    "std::path::Path::read_dir", "std::path::Path::read_link",
    "std::path::Path::exists", "std::path::Path::try_exists",
    "std::path::Path::is_file", "std::path::Path::is_dir", "std::path::Path::is_symlink",
    "std::io::stdin", "std::io::stdout", "std::io::stderr",
]
disallowed-types = [
    "std::fs::File", "std::fs::OpenOptions", "std::fs::DirBuilder",
    "std::net::TcpStream", "std::net::TcpListener", "std::net::UdpSocket",
    "std::process::Command",
]
disallowed-macros = ["std::env", "std::option_env", "std::include_str", "std::include_bytes"]
