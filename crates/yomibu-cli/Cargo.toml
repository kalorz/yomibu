[package]
name = "yomibu-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "yomibu"

[[bin]]
name = "yomibu"
path = "src/main.rs"
# Public Rustdoc belongs to the library crates.
doc = false

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1", features = ["rt", "time"] }
uuid.workspace = true
yomibu-app = { path = "../yomibu-app" }
yomibu-core = { path = "../yomibu-core" }
yomibu-ext = { path = "../yomibu-ext" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }

[lints.rust]
unreachable_pub = "warn"
