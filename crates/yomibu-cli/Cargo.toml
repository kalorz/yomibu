[package]
name = "yomibu-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "yomibu"

[[bin]]
name = "yomibu"
path = "src/main.rs"
# Public Rustdoc belongs to the library; both targets are named yomibu.
doc = false

[dependencies]
yomibu.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true

[dev-dependencies]
wiremock.workspace = true
tokio = { workspace = true, features = ["macros", "io-util", "sync", "test-util"] }
