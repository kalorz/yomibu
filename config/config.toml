# Application resources and policy. No component choices or secret values.
# Discovery: --config / YOMIBU_CONFIG, otherwise <data-dir>/config.toml.
# Relative paths use this file's directory. Defaults files are its siblings.
[application]
sync = true
cache_max_age_seconds = 3600
allow_embedding_call = false
# inventory = "inventory.json"          # optional manual inventory
# wanikani_cache = "wanikani.json"       # computed: <data-dir>/wanikani.json
# dictionary_dir = "dictionaries"       # computed: <data-dir>/dictionaries
# embedding_cache = "embeddings.json"   # computed: <data-dir>/embeddings.json
# Optional paths accept { clear = true } to restore implicit behavior.
# Explicit paths affect missing-resource diagnostics and inventory merging.

# Values come from generated component CLI/ENV inputs or the supplied provider.
# Shared inputs: --credential-openai / YOMIBU_CREDENTIAL_OPENAI and
# --credential-wanikani / YOMIBU_CREDENTIAL_WANIKANI. Never store keys here.
[application.credentials]
"wanikani-source.api-key" = { provider = "supplied", key = "wanikani" }
"openai-story-generation.api-key" = { provider = "supplied", key = "openai" }
"http-embeddings.api-key" = { provider = "supplied", key = "openai" }
# Private binding alternative (caller-supplied exact component slot):
# "http-embeddings.api-key" = { provider = "supplied", key = "http-embeddings.api-key" }
# Remove a binding, while retaining direct component CLI/ENV input:
# "http-embeddings.api-key" = { clear = true }
