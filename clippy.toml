# Ambient-effect guards for core and app, switched on by `forbid` in their lib.rs.
# Partial by design: review new libraries and APIs for effects these lists miss.
disallowed-methods = [
    "std::time::Instant::now", "std::time::Instant::elapsed",
    "std::time::SystemTime::now", "std::time::SystemTime::elapsed",
    "std::env::var", "std::env::var_os", "std::env::vars", "std::env::vars_os",
    "std::env::set_var", "std::env::remove_var", "std::env::args", "std::env::args_os",
    "std::env::current_dir", "std::env::set_current_dir", "std::env::current_exe",
    "std::env::home_dir", "std::env::temp_dir",
    "std::fs::read", "std::fs::read_to_string", "std::fs::write",
    "std::fs::metadata", "std::fs::symlink_metadata", "std::fs::exists",
    "std::fs::read_dir", "std::fs::read_link", "std::fs::canonicalize",
    "std::fs::copy", "std::fs::rename", "std::fs::hard_link", "std::fs::set_permissions",
    "std::fs::soft_link",
    { path = "std::os::unix::fs::symlink", allow-invalid = true },
    "std::fs::create_dir", "std::fs::create_dir_all",
    "std::fs::remove_file", "std::fs::remove_dir", "std::fs::remove_dir_all",
    "std::path::absolute", "std::path::Path::canonicalize",
    "std::path::Path::metadata", "std::path::Path::symlink_metadata",
    "std::path::Path::read_dir", "std::path::Path::read_link",
    "std::path::Path::exists", "std::path::Path::try_exists",
    "std::path::Path::is_file", "std::path::Path::is_dir", "std::path::Path::is_symlink",
    "std::io::stdin", "std::io::stdout", "std::io::stderr", "std::io::pipe",
    "std::process::exit", "std::process::abort",
    "std::net::ToSocketAddrs::to_socket_addrs",
    # These exist only when a dependency enables UUID generation features.
    { path = "uuid::Uuid::now_v1", allow-invalid = true },
    { path = "uuid::Uuid::new_v4", allow-invalid = true },
    { path = "uuid::Uuid::now_v6", allow-invalid = true },
    { path = "uuid::Uuid::new_v7", allow-invalid = true },
    { path = "uuid::Uuid::now_v7", allow-invalid = true },
    { path = "uuid::ContextV1::new_random", allow-invalid = true },
    { path = "uuid::Timestamp::now", allow-invalid = true },
]
disallowed-types = [
    "std::fs::File", "std::fs::OpenOptions", "std::fs::DirBuilder",
    "std::net::TcpStream", "std::net::TcpListener", "std::net::UdpSocket",
    { path = "std::os::unix::net::UnixStream", allow-invalid = true },
    { path = "std::os::unix::net::UnixListener", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram", allow-invalid = true },
    "std::process::Command",
    { path = "uuid::ContextV7", allow-invalid = true },
]
disallowed-macros = ["std::env", "std::option_env", "std::include_str", "std::include_bytes", "std::dbg"]
